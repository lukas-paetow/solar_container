# create controller identity, create role of the lease, then connect them

apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-lease
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-lease
subjects:
  - kind: ServiceAccount
    name: controller
roleRef:
  kind: Role
  name: controller-lease
  apiGroup: rbac.authorization.k8s.io
